server {

	listen 80;
	server_name www.dev-ouvretaferme.org demo.dev-ouvretaferme.org www.dev-ouvretaferme.localhost;
	root /var/www/otf;

	include /var/www/otf/framework/dev/conf/rewrite/bot.cfg;
	include /var/www/otf/framework/dev/conf/rewrite/scan.cfg;
    include /var/www/otf/ouvretaferme/main/conf/rewrite/minify.cfg;
	include /var/www/otf/framework/dev/conf/rewrite/static.cfg;

	location @minify {
		rewrite ^(.*)$ /_lime?$args&limeEnv=dev&limeApp=ouvretaferme&limeName=$1? last;
	}

	location / {
		rewrite ^/([0-9]+)/exercice/([0-9]+)/(.*)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/@/$3&structure=$1&financialYear=$2? last;
		rewrite ^/([0-9]+)/(.*)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/@/$2&structure=$1? last;
		rewrite ^(\/public[\:\/][a-zA-Z0-9\_\-\.]+)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/company$1? last;
		rewrite ^(.*)$ /_lime?$args&limeEnv=dev&limeApp=ouvretaferme&limeName=$1? last;
	}

	include /var/www/otf/framework/dev/conf/rewrite/lime.cfg;

}

server {

	listen 80;
	server_name site.dev-ouvretaferme.org;
	root /var/www/otf;

	include /var/www/otf/framework/dev/conf/rewrite/bot.cfg;
	include /var/www/otf/framework/dev/conf/rewrite/scan.cfg;
    include /var/www/otf/ouvretaferme/main/conf/rewrite/minify.cfg;
	include /var/www/otf/framework/dev/conf/rewrite/static.cfg;

	location @minify {
		rewrite ^(.*)$ /_lime?$args&limeEnv=dev&limeApp=ouvretaferme&limeName=$1? last;
	}

	location / {
		rewrite ^(\/[a-zA-Z0-9\_\-]+[\/]?)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/public$1? last;
		rewrite ^(\/[a-zA-Z0-9\_\-]+\/[a-zA-Z0-9\_\-\.\:]+)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/public$1? last;
		rewrite ^(\/[a-zA-Z0-9\_\-]+)\/.+$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/public$1/400? last;
		rewrite /robots.txt /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/public/robots.txt last;
        rewrite ^(.*)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/error$1? last;
	}

	include /var/www/otf/framework/dev/conf/rewrite/lime.cfg;

}

server {

	listen 80;
	server_name api.dev-ouvretaferme.org;
	root /var/www/otf;

	include /var/www/otf/framework/dev/conf/rewrite/bot.cfg;
	include /var/www/otf/framework/dev/conf/rewrite/scan.cfg;

	location / {
		rewrite ^\/([a-z0-9\.]+)\/([a-zA-Z]+)\/(.+)\/([a-zA-Z]+)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/api/&version=$1&route=$2/%7Bid%7D/$4&id=$3? last;
		rewrite ^\/([a-z0-9\.]+)\/([a-zA-Z]+)\/(.+)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/api/&version=$1&route=$2/%7Bid%7D&id=$3? last;
		rewrite ^\/([a-z0-9\.]+)\/([a-zA-Z]+)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/api/&version=$1&route=$2&id=? last;
		rewrite ^\/([a-z0-9\.]+)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/api/&version=$1&route=&id=? last;
        rewrite ^(.*)$ /_lime?$args&origin=internal&limeEnv=dev&limeApp=ouvretaferme&limeName=/api/? last;
	}

	include /var/www/otf/framework/dev/conf/rewrite/lime.cfg;

}

