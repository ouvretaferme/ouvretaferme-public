# Clé vide = requête non comptabilisée : les static échappent aux deux limites.
# En HTTP/2 chaque stream compte comme une connexion, une galerie de vignettes
# suffit sinon à faire sauter le plafond. Exemption sur l'origine et non sur
# l'extension : sur les vhosts applicatifs, une URI en .png inexistante atteint
# PHP et contournerait la limite.
# $request_uri et non $uri : les limites sont évaluées en phase preaccess, donc
# après le rewrite de static.cfg qui a déjà transformé /static/base/structure/…
# en /base/structure/static/… — $uri ne commence alors plus par /static/.
map $host$request_uri $limitKey {
	default                       $binary_remote_addr;
	~^media\.ouvretaferme\.org/   "";
	~^[^/]+/(?:static|minify)/    "";
}

limit_req_zone  $limitKey zone=app:20m rate=30r/s;
limit_conn_zone $limitKey zone=addr:10m;

# Les IP de sortie type iCloud Private Relay agrègent beaucoup d'utilisateurs
# distincts : burst large, sinon un pic légitime prend un 429.
limit_req zone=app burst=50 nodelay;
limit_conn addr 50;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

server {

	listen 443 ssl http2;
	server_name www.ouvretaferme.org;
	root /var/www/otf;

    ssl_certificate /etc/letsencrypt/live/www.ouvretaferme.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ouvretaferme.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	include /var/www/otf/framework/dev/conf/rewrite/bot.cfg;
	include /var/www/otf/framework/dev/conf/rewrite/scan.cfg;
    include /var/www/otf/ouvretaferme/main/conf/rewrite/minify.cfg;
	include /var/www/otf/framework/dev/conf/rewrite/static.cfg;


	location @minify {
		rewrite ^(.*)$ /_lime?$args&limeEnv=prod&limeApp=ouvretaferme&limeName=$1? last;
	}

	location / {
		rewrite ^/([0-9]+)/exercice/([0-9]+)/(.*)$ /_lime?$args&origin=internal&limeEnv=prod&limeApp=ouvretaferme&limeName=/@/$3&structure=$1&financialYear=$2? last;
		rewrite ^/([0-9]+)/(.*)$ /_lime?$args&origin=internal&limeEnv=prod&limeApp=ouvretaferme&limeName=/@/$2&structure=$1? last;
		rewrite ^(\/public[\:\/][a-zA-Z0-9\_\-\.]+)$ /_lime?$args&origin=internal&limeEnv=prod&limeApp=ouvretaferme&limeName=/company$1? last;
		rewrite ^(.*)$ /_lime?$args&limeEnv=prod&limeApp=ouvretaferme&limeName=$1? last;
	}

	include /var/www/otf/framework/dev/conf/rewrite/lime.cfg;

}

