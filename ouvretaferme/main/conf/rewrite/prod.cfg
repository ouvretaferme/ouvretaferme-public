server {

	listen 443 ssl http2;
	server_name media.ouvretaferme.org;
	root /var/www/storage;

    ssl_certificate /etc/letsencrypt/live/media.ouvretaferme.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.ouvretaferme.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	error_page 404 /404.png;

	expires 30d;

	# Seuls les dossiers des types publics se servent, avec l'image d'erreur et l'export de démonstration
	# que cite INSTALL.md. Un document privé (justificatif, relevé, facture, bilan) se lit par la route
	# de son paquet, qui vérifie les droits, et une adresse qui porte son hash n'ouvre plus rien ici.
	# La liste est PUBLIC de base/media/test/MediaPublicSentinelAi.t.php, qui la compare à celle-ci.
	location ~ ^/(?:user-vignette|shop-logo|shop-banner|amap-producer-photo|editor|plant-vignette|product-vignette|learning-course|learning-quiz|block-item|maintenance-done|tool-vignette|gallery|structure-email-banner|structure-banner|structure-logo|website-favicon|website-logo|website-banner|webpage-banner)/ {
	}

	location = /404.png {
	}

	location = /demo.sql {
	}

	location / {
		return 404;
	}

}

