# ^~ fait passer ce préfixe devant les locations en expression régulière de static.cfg et minify.cfg.
# Un « return » posé au niveau du server court-circuite toutes ses locations : la redirection d'un
# bloc qui inclut ce fichier doit vivre dans « location / ».
location ^~ /.well-known/acme-challenge/ {
	root /var/www/letsencrypt;
	default_type text/plain;
}
