System:
  id: serial32
  structure: structure\Structure
  place: ?text8(1, null)
  placeLngLat: ?point
  placeCity: ?textFixed(5, 5) @charset(ascii) # Code INSEE de la commune du point, déduit de placeLngLat par geo.api.gouv.fr quand le point change. NULL : point absent, hors de France, ou déduction pas encore faite (l'appel a échoué, le rattrapage de la nuit placeCodesAi la refait)
  placeDepartment: ?text8(2, 3) @charset(ascii) # Code du département de la même commune (01, 2A, 974). C'est lui qui fonde le territoire de la structure, avant le code postal du siège
  placeEpci: ?textFixed(9, 9) @charset(ascii) # SIREN de l'intercommunalité de la même commune
  totalArea: ?float(0.0, 500.0)
  altitude: ?int(0, null)
  climate: ?enum(OCEANIC, CONTINENTAL, MEDITERRANEAN, MOUNTAIN)
  soil: ?enum(SABLEUX, LIMONEUX, ARGILEUX, SABLO_LIMONEUX, LIMONO_SABLEUX, SABLO_ARGILEUX, SABLO_ARGILO_LIMONEUX, ARGILO_SABLEUX, LIMONO_ARGILEUX, LIMONO_ARGILO_SABLEUX, ARGILO_LIMONEUX)
  ph: ?decimal(3, 1, 1.0, 14.0)
  hrFarmer: ?decimal(3, 1, 0.0, null)
  hrEmployee: ?decimal(3, 1, 0.0, null)
  hrOther: ?decimal(3, 1, 0.0, null)
  sellingDirect: ?int(0, 100)
  sellingSemi: ?int(0, 100)
  sellingLong: ?int(0, 100)
  UNIQUE: [
    ["structure"]
  ]

