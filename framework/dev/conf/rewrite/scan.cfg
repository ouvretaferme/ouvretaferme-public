# Chemins qu'aucune adresse du produit ne peut désigner, refusés avant d'atteindre PHP : le
# `location /` de chaque vhost réécrit tout vers `/_lime`, donc sans ce fichier un /wp-admin démarre
# PHP et y cherche une route pour rendre son 404.
# `if` au niveau du `server`, donc évalué dans la phase de réécriture, avant toute sélection de
# location : le refus ne dépend pas de sa position parmi les locations à expression des vhosts, mais
# il passe aussi devant le `location ^~` d'acme.cfg, que rien ne protège plus.
# 444 ferme la connexion sans réponse et reste journalisé : la surveillance range tout statut de 400
# à 499 en balayage (`security\AccessEventLib::accumulate()`), donc l'écran continue de voir ces
# requêtes, que l'alerte Discord ne compte plus (`AccessEventLib::isNotifiable()`).
# `$request_uri` porte la query string, donc un motif ne s'ancre sur la fin du chemin qu'en admettant un `?`.
# Contrôle de ce que les motifs n'attrapent pas : security/test/NginxScanSentinelAi.t.php

# WordPress, qui n'a jamais tourné ici. Le motif ne s'ancre pas sur le début : les balayages
# préfixent leur chemin de l'adresse d'une boutique (/<boutique>/wp-json/...).
if ($request_uri ~* "/wp-(?:admin|config|content|includes|json|login)|/wp/v2/|/wordpress/|/xmlrpc\.php") {
	return 444;
}

# Fichiers de configuration et dépôts de code. Les cinq noms plutôt que tout `/.`, qui couperait le
# défi ACME et donc le renouvellement des certificats ; et le type `fqn` (framework/core/Filter.php)
# admettant le point, une boutique peut par ailleurs s'appeler «.quelquechose».
if ($request_uri ~* "/\.(?:env|git|svn|aws|ssh)") {
	return 444;
}

# Fichiers JSON, que les balayages demandent pour y trouver une clé (firebase-key.json, gcp.json,
# terraform.tfvars.json…). Le produit n'en sert que deux sortes, ses fichiers statiques et la
# collection Postman de la documentation de l'API : refuser le suffixe plutôt que chaque nom, la liste
# des noms ne se fermant jamais. Seul motif ancré sur la fin, d'où `(?:\?|$)` pour la query string.
if ($request_uri ~* "^(?!/static/|/developer/postman-collection\.json)[^?]*\.json(?:\?|$)") {
	return 444;
}

# Consoles et points d'entrée d'autres logiciels, relevés sur le trafic réel. La liste se revoit tous
# les mois sur le rappel du cron security/cron/access:review (security/configure/scanReviewAi).
if ($request_uri ~* "/actuator/|/phpmyadmin|/cgi-bin/|/wsman|/sonicui/|/functionRouter|/exec-py|/inngest|/storage/logs/") {
	return 444;
}
