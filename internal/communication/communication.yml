DiscordAccess:
  id: serial32
  user: user\User
  structure: structure\Structure
  status: enum(JOINED, REVOKED) = JOINED
  discordId: text8
  refreshToken: ?text8
  joinedAt: datetime
  revokedAt: ?datetime
  UNIQUE: [
    ["user"]
  ]
  INDEX: [
    ["status"]
  ]

DiscordInvitation:
  id: serial32
  structure: structure\Structure
  key: text8 = PHP(bin2hex(random_bytes(6)))
  createdAt: datetime = SPECIAL(now)
  UNIQUE: [
    ["structure"],
    ["key"]
  ]

Note:
  id: serial32
  title: text8(1, 100)
  content: editor16(1, 2048)
  buttonLabel: ?text8(1, 30)
  buttonPath: ?text8(1, 100)
  structureTypes: json = PHP([])
  features: json = PHP([])
  structures: int32(0, null)
  users: int32(0, null)
  views: ?int32(0, null)
  reads: ?int32(0, null)
  createdBy: user\User
  createdAt: datetime = SPECIAL(now)
  INDEX: [
    ["createdAt"]
  ]

NoteRecipient:
  id: serial32
  note: communication\Note
  user: user\User
  structure: structure\Structure
  seenAt: ?datetime
  readAt: ?datetime
  createdAt: datetime = SPECIAL(now)
  UNIQUE: [
    ["note", "user", "structure"]
  ]
  INDEX: [
    ["user", "structure", "createdAt"],
    ["createdAt"]
  ]

WebinaireSubscription:
  id: serial32
  firstName: text8(1, PHP(\user\UserSetting::NAME_SIZE_MAX)) @collate(general)
  lastName: text8(1, PHP(\user\UserSetting::NAME_SIZE_MAX)) @collate(general)
  email: email(1, 100)
  date: int8
  createdAt: datetime = SPECIAL(now)
  UNIQUE: [
    ["email"],
  ]
